[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-agent"
version = "0.1.0"
description = "Local source-backed knowledge for connected agents"
requires-python = ">=3.12"
dependencies = ["pypdf==6.17.0", "pyyaml==6.0.3", "mcp==2.1.1"]

[project.optional-dependencies]
ocr-macos = ["pyobjc-framework-Vision==12.2.2; sys_platform == 'darwin'"]

[project.scripts]
knowledge-agent = "knowledge_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "specs", "docs", "examples", "README.md", "AGENTS.md", "CLAUDE.md", "CONTINUATION.md", "IMPLEMENTATION_STATUS.md", "pyproject.toml", "uv.lock", ".gitignore", ".env.example"]
