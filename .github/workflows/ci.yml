name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Keep CI local and deterministic until an explicit Nx Cloud decision is made.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec nx format:check --base="remotes/origin/main"
      - run: pnpm exec nx run-many -t typecheck --output-style=static
      - run: pnpm exec nx run knowledge:test --output-style=static
      - run: pnpm exec nx run plan-draft:test --output-style=static
