name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Keep CI local and deterministic until an explicit Nx Cloud decision is made.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - run: pnpm install --frozen-lockfile

      - run: >-
          git diff --name-only --diff-filter=ACMR remotes/origin/main -- .
          ':!packages/workflow-runtime/assets/**'
          ':!packages/workflow-runtime/provenance.json'
          | pnpm exec nx format:check --stdin
      - run: pnpm exec nx run-many -t typecheck --output-style=static
      - name: Verify canonical workflow and recovery
        run: pnpm exec nx run-many -t test -p contracts,temari-core,workflow-engine,runtime --parallel=1 --skipNxCache --skipSync --output-style=static
      - run: pnpm exec nx run knowledge:test --output-style=static
      - run: pnpm exec nx run plan-draft:test --output-style=static
      - run: pnpm exec nx run-many -p workflow-runtime -t test check --skipNxCache --skipSync --output-style=static
